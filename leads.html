<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="keywords" content="">
    <meta name="author" content="">
    <meta name="robots" content="">
    <meta name="description" content="Leads - Contact Form Submissions">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- FAVICONS ICON -->
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" type="image/x-icon" href="images/favicon.png">

    <!-- PAGE TITLE HERE -->
    <title>Contact Leads</title>

    <!-- STYLESHEETS -->
    <link rel="stylesheet" type="text/css" href="css/plugins.css">
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link class="skin" rel="stylesheet" type="text/css" href="css/skin/skin-3.css">
    <link rel="stylesheet" type="text/css" href="css/templete.css">
    <style>
        .leads-container {
            padding: 50px 0;
            background: #f9f9f9;
            min-height: 100vh;
        }

        .leads-table-wrapper {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }

        .page-title {
            margin-bottom: 30px;
            text-align: center;
            color: #333;
        }

        .table thead th {
            background-color: #2c3e50;
            color: #fff;
            border: none;
        }

        .table-striped tbody tr:nth-of-type(odd) {
            background-color: #f2f2f2;
        }

        .btn-clear {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .btn-clear:hover {
            background-color: #c0392b;
        }
    </style>
</head>

<body id="bg">
    <div class="page-wraper roboto-condensed">
        <!-- header -->
        <header class="site-header mo-left header-transparent box-header header">
            <div class="sticky-header main-bar-wraper navbar-expand-lg">
                <div class="main-bar clearfix" style="background-color: azure;">
                    <div class="container clearfix">
                        <!-- website logo -->
                        <div class="logo-header mostion logo-dark">
                            <a href="index.html"><img src="images/logo-3.png" alt="Logo"></a>
                        </div>
                        <!-- extra nav button -->
                        <div class="extra-nav">
                            <a href="contact-2.html" class="site-button radius-no">Back to Form</a>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <div class="page-content bg-white">
            <div class="leads-container">
                <div class="container">
                    <h2 class="page-title">Submitted Leads</h2>

                    <div class="leads-table-wrapper">
                        <div class="text-right">
                            <button class="btn-clear" onclick="clearLeads()">Clear All Leads</button>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Time</th>
                                        <th>Name</th>
                                        <th>Email</th>
                                        <th>Phone Number</th>
                                        <th>Message</th>
                                    </tr>
                                </thead>
                                <tbody id="leadsTableBody">
                                    <!-- Rows will be populated here -->
                                </tbody>
                            </table>
                        </div>
                        <p id="noLeadsMessage" style="text-align: center; display: none;">No leads found.</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="site-footer">
            <div class="footer-bottom">
                <div class="container">
                    <div class="row">
                        <div class="col-md-12 text-center">
                            <span>Copyright © <span class="current-year">2024</span> <a href="#"
                                    target="_blank">PCD_PDC</a>. all rights reserved.</span>
                        </div>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <!-- JAVASCRIPT FILES -->
    <script src="js/jquery.min.js"></script>
    <script src="plugins/bootstrap/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            loadLeads();
        });

        function loadLeads() {
            const tableBody = document.getElementById('leadsTableBody');
            const noLeadsMessage = document.getElementById('noLeadsMessage');
            const leads = JSON.parse(localStorage.getItem('contactLeads')) || [];

            tableBody.innerHTML = '';

            if (leads.length === 0) {
                noLeadsMessage.style.display = 'block';
            } else {
                noLeadsMessage.style.display = 'none';
                // Sort by newest first (optional, but good UX)
                leads.reverse().forEach(lead => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${lead.date}</td>
                        <td>${lead.time}</td>
                        <td>${lead.name}</td>
                        <td>${lead.email}</td>
                        <td>${lead.number}</td>
                        <td>${lead.message}</td>
                    `;
                    tableBody.appendChild(row);
                });
            }
        }

        function clearLeads() {
            if (confirm('Are you sure you want to delete all leads?')) {
                localStorage.removeItem('contactLeads');
                loadLeads();
            }
        }
    </script>
</body>

</html>
